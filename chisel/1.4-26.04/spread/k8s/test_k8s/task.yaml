summary: chisel cuts a root filesystem from inside the cluster

execute: |

  # Cilium (CNI) is not yet supported on s390x and ppc64le
  # so we'll skip the k8s tests on those architectures for now
  # ---
  # TODO: Remove this check once Cilium supports s390x and ppc64le
  if [ "$(uname -m)" = "s390x" ] || [ "$(uname -m)" = "ppc64le" ]; then
    echo "Skipping k8s tests on $(uname -m) architecture"
    exit 0
  fi

  # Cleanup function
  cleanup() {
    k8s kubectl delete -f job.yaml --ignore-not-found --timeout=60s || true
  }
  trap cleanup EXIT

  # The job cuts into an emptyDir with the rock, then verifies the result from a
  # second container sharing the volume. It completes only if both succeed.
  k8s kubectl apply -f job.yaml

  # kubectl wait has no notion of a job that can no longer complete, so with
  # backoffLimit 0 a failed cut would sit here until the timeout expires.
  deadline=$((SECONDS + 420))
  while true; do
    conditions=$(k8s kubectl get job/chisel-cut -o jsonpath='{.status.conditions[*].type}')
    case " $conditions " in
      *" Complete "*)
        break
        ;;
      *" Failed "*)
        echo "chisel-cut did not complete:" >&2
        k8s kubectl logs job/chisel-cut --all-containers --tail=200 >&2 || true
        exit 1
        ;;
    esac
    if [ "$SECONDS" -ge "$deadline" ]; then
      echo "chisel-cut timed out:" >&2
      k8s kubectl describe job/chisel-cut >&2 || true
      k8s kubectl logs job/chisel-cut --all-containers --tail=200 >&2 || true
      exit 1
    fi
    sleep 5
  done
