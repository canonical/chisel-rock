name: chisel
version: '1.4'

summary: Chisel is a software tool for carving and cutting Debian packages!
description: |
    Chisel can derive a minimal Ubuntu-like Linux distribution using a release
    database that defines "slices" of existing packages. Slices enable
    developers to cherry-pick just the files they need from the Ubuntu
    archives, and combine them to create a new filesystem which can be packaged
    into an OCI-compliant container image or similar.

    This image is a chiselled Ubuntu rock containing only the chisel binary and
    the CA certificates it needs to reach the slice definitions and the archive.

# rockcraft validates against a deprecated SPDX list, so the current
# "AGPL-3.0-only" identifier is rejected in favour of this one.
license: AGPL-3.0

base: bare
build-base: ubuntu@26.04

platforms:
    amd64:
    arm64:
    ppc64el:
    s390x:

environment:
    # Without this chisel falls back to $HOME/.cache, and then to a fresh
    # temporary directory when HOME is unset, losing the download cache.
    XDG_CACHE_HOME: /var/cache

parts:
    chisel:
        plugin: go
        source: https://github.com/canonical/chisel.git
        source-type: git
        source-tag: v1.4.2
        source-depth: 1
        build-snaps:
            - go/1.25/stable
        build-environment:
            - CGO_ENABLED: "0"
            # One -ldflags, not the two upstream's snapcraft.yaml uses: cmd/go
            # replaces the flag on each occurrence rather than appending, so
            # only the last one ever reaches the linker. -s covers -w anyway.
            - GOFLAGS: -trimpath -ldflags=-s
        override-build: |
            # source-depth 1 leaves no history for `git describe`, so hand the
            # version to the generator instead of running `go generate ./cmd`.
            ./cmd/mkversion.sh v1.4.2
            craftctl default
        # The go plugin also builds internal/deb/chrorder, which is a code
        # generator with no business in the image.
        stage:
            - usr/bin/chisel

    system-files:
        plugin: nil
        stage-packages:
            - base-files_base
            - base-files_chisel
            - base-files_release-info
            # Go reads the bundle at /etc/ssl/certs/ca-certificates.crt to reach
            # codeload.github.com and the Pro archives over TLS.
            - ca-certificates_data
        override-prime: |
            craftctl default

            # Mount point for Pro credentials. Without the directory chisel
            # reports a read error for it on every cut, Pro archive or not.
            mkdir -p ${CRAFT_PRIME}/etc/apt/auth.conf.d

    # Covers the chiselled debs only. The chisel binary is built from source and
    # so has no entry in the generated manifest.
    deb-security-manifest:
        plugin: make
        after: [chisel, system-files]
        source: https://github.com/canonical/rocks-security-manifest
        source-type: git
        source-branch: main
        override-prime: gen_manifest
