name: chisel
version: '1'

summary: Chisel is a software tool for carving and cutting Debian packages!
description: |
    Chisel can derive a minimal Ubuntu-like Linux distribution using a release
    database that defines "slices" of existing packages. Slices enable
    developers to cherry-pick just the files they need from the Ubuntu
    archives, and combine them to create a new filesystem which can be packaged
    into an OCI-compliant container image or similar.

    This image is a chiselled Ubuntu rock containing only the chisel binary and
    the CA certificates it needs to reach the slice definitions and the archive.

license: AGPL-3.0

base: bare
build-base: ubuntu@26.04

platforms:
    amd64:
    arm64:
    ppc64el:
    s390x:

environment:
    # HOME is unset here, and chisel's fallback for that is a throwaway dir.
    XDG_CACHE_HOME: /var/cache

parts:
    chisel:
        plugin: go
        source: https://github.com/canonical/chisel.git
        source-type: git
        source-tag: v1.5.1
        source-depth: 1
        build-snaps:
            - go/1.25/stable
        build-environment:
            - CGO_ENABLED: "0"
            # Upstream passes -ldflags twice; cmd/go keeps only the last, and
            # -s covers -w anyway.
            - GOFLAGS: -trimpath -ldflags=-s
        override-build: |
            # go generate ./cmd derives this from git describe, which has no
            # history to work with under source-depth 1.
            ./cmd/mkversion.sh v1.5.1
            craftctl default
        # Drops chrorder, the code generator the go plugin also builds.
        stage:
            - usr/bin/chisel

    system-files:
        plugin: nil
        stage-packages:
            - base-files_base
            - base-files_chisel
            - base-files_release-info
            # _data is enough: it carries the bundle Go's x509 looks for.
            - ca-certificates_data
        override-prime: |
            craftctl default

            # Pro credential mount point. Chisel reports a read error for the
            # directory on every cut when it is missing.
            mkdir -p ${CRAFT_PRIME}/etc/apt/auth.conf.d

    # Covers the chiselled debs only - nothing from the source-built binary.
    deb-security-manifest:
        plugin: make
        after: [chisel, system-files]
        source: https://github.com/canonical/rocks-security-manifest
        source-type: git
        source-branch: main
        override-prime: gen_manifest
